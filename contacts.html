    <link rel="stylesheet" href="node_modules/bootswatch/dist/solar/bootstrap.min.css">
    <link rel="stylesheet" href="node_modules/@fortawesome/fontawesome-free/css/all.min.css">
    <link rel="stylesheet" href="node_modules/tom-select/dist/css/tom-select.bootstrap5.min.css">
    <script src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="node_modules/tinymce/tinymce.min.js"></script>
    <script src="node_modules/tom-select/dist/js/tom-select.complete.min.js"></script>
    <title>Document</title>
</head>

<style>
        
        .form-container {
            max-width: 650px;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px; /*zakulaceni*/
            
        }

        .form-control,
        .ts-control, /*tomselect*/
        .tox-tinymce, /*tinymce*/
        .ts-dropdown {
            background-color: #ffffff;
        }
        
        .ts-wrapper.multi .ts-control { /*formatovani vice vyberu v tomselectu*/
            padding-top: 24px;
            padding-bottom: 8px;
        }
        .custom-label-fix { /*formatovani pole ve wisywigu*/
            margin-bottom: 8px;
            color: #212529;
        }
    </style>

<body>
    <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">

            <a class="navbar-brand" href="index.html"><img src="img/league.png" alt="League"
                    style="max-width: 70px;"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarColor01"
                aria-controls="navbarColor01" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarColor01">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Informace o hře
                            <span class="visually-hidden">(current)</span>

                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="champs.html">Šampioni</a>
                    </li>

                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" data-bs-toggle="dropdown" href="#" role="button"
                            aria-haspopup="true" aria-expanded="false">Jiné</a>
                        <div class="dropdown-menu">
                            <a class="dropdown-item" href="progress.html">Progress</a>
                            <a class="dropdown-item" href="Dokumentace webu.pdf " target="_blank">Dokumentace</a>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <h1 style="text-align: center; margin: 30px; color: white;">Kontakt na vývojáře</h1>
    <p style="color: white; text-align: center;">Máte dotaz k hře? Napište nám!</p>

<div class="container col-sm-4 offset-4" >
    <div class="form-container ">
        <h2 class="mb-4 text-center">Dotazy do studia <i class="fa-solid fa-inbox"></i></h2>
        
        <form enctype="multipart/form-data" class="needs-validation">
            
            <div class="form-floating mb-3 position-relative">
                <input type="email" class="form-control" id="email" name="email" required>
                <label for="email"><i class="fa-regular fa-envelope"></i> E-mail</label>
            </div>

            <div class="mb-3 position-relative">
                <label for="chyby" class="form-label custom-label-fix">Typ chyby</label>
                <select id="chyby" name="chyby[]" multiple placeholder="Vyberte chybu..." autocomplete="off" required>
                    <option value="G">Glitch</option>
                    <option value="NV">Nezdokumentovaná vlastnost</option>
                    <option value="S">Stížnost</option>
                    <option value="VB">Vlastní blbost</option>
                    <option value="D">Dotaz</option>
                </select>
            </div>

            <div class="mb-4">
                <label for="motivace" class="form-label custom-label-fix">Text</label>
                <textarea id="motivace" name="motivace" placeholder="Piš ty mamlas!!!"></textarea>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg">Odeslat dotaz</button>
            </div>

        </form>
    </div>
</div>

<script>
    
    tinymce.init({
    selector: '#motivace',
    license_key: 'gpl',
    height: 300,
    menubar: false,
    branding: false,
    })

    new TomSelect('#chyby', {
    plugins: ['remove_button'], /*odstraneni vyberu*/
    create: false, /* nemuze se vytvorit dalsi*/
    placeholder: 'Vyberte chybu...' /*default zobrazeni*/
});
    
</script>




    <footer style="width: 100%;" class="bg-primary">

                <span style="margin-left: 50px;"> Address: 7 - 11 Sir
                    John Rogerson's Quay,
                    Dublin 2,
                    Ireland.
                </span>
            </p>
                 <a href="Dokumentace webu.pdf" target="_blank"
                    style="color: white;">Dokumentace</a>
        </div>
    </footer>

</body>
